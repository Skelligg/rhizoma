# The whole site on one server: Caddy in front, the application, and PostgreSQL.
# Run from the repository root:
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# Copy deploy/.env.example to deploy/.env first and fill it in. deploy/.env is never committed.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    build:
      context: ..
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rhizoma
      SPRING_DATASOURCE_USERNAME: rhizoma
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      # The application sits behind Caddy and trusts the address and scheme Caddy passes on.
      SERVER_FORWARD_HEADERS_STRATEGY: native
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: rhizoma
      POSTGRES_USER: rhizoma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rhizoma -d rhizoma']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
